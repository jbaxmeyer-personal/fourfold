<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1020" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Fourfold</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%AC%A2%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
  <div id="app">
    <header id="top">
      <div class="stat hp"><b id="hp"></b></div>
      <div id="encounter"><div id="encName">—</div><div id="track"></div></div>
      <div class="stat gold">● <b id="gold">0</b></div>
    </header>
    <div id="traits"></div>
    <div id="stage">
      <div id="overlay"></div>
      <div id="toast"></div>
      <div id="info" class="hidden"></div>
      <button id="speed" class="hidden">1×</button>
    </div>
    <div id="bench"></div>
    <div id="shopbar">
      <div id="shop"></div>
      <div id="actions">
        <button id="reroll">⟳ Reroll <span>2</span></button>
        <button id="lock" title="Lock shop">🔓</button>
        <button id="fight">Fight ⚔</button>
      </div>
      <div id="sellzone">Drop to sell</div>
    </div>
    <div id="ghost" class="hidden"><img alt="" /></div>
    <div id="modal" class="hidden"></div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
